<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --figma-bg: var(--figma-color-bg, #2c2c2c);
      --figma-bg-secondary: var(--figma-color-bg-secondary, #383838);
      --figma-text: var(--figma-color-text, #ffffff);
      --figma-text-secondary: var(--figma-color-text-secondary, #b3b3b3);
      --figma-border: var(--figma-color-border, #444444);
      --figma-brand: var(--figma-color-bg-brand, #0c8ce9);
      --figma-brand-hover: var(--figma-color-bg-brand-hover, #1096f2);
      --figma-brand-text: var(--figma-color-text-onbrand, #ffffff);
      --figma-danger: #f24822;
      --figma-success: #14ae5c;
      --figma-warning: #ffcd29;
    }

    * { box-sizing: border-box; }

    body {
      background-color: var(--figma-bg);
      color: var(--figma-text);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      margin: 0;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      gap: 10px;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    h2 {
      font-size: 11px;
      font-weight: 600;
      margin: 0;
      color: var(--figma-text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .header-actions {
      display: flex;
      gap: 4px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--figma-text);
      width: 28px;
      height: 28px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }

    .icon-btn:hover {
      background: var(--figma-bg-secondary);
      border-color: var(--figma-border);
    }

    .icon-btn:active {
      background: rgba(255, 255, 255, 0.05);
    }

    .icon-btn.active {
      background: rgba(12, 140, 233, 0.15);
      border-color: var(--figma-brand);
      color: var(--figma-brand);
    }

    .primary-btn {
      background: var(--figma-brand);
      color: var(--figma-brand-text);
      border: 1px solid transparent;
    }

    .primary-btn:hover {
      background: var(--figma-brand-hover);
    }

    .counter-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      background-color: var(--figma-bg-secondary);
      border: 1px solid var(--figma-border);
      border-radius: 5px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 500;
      color: var(--figma-text-secondary);
      transition: all 0.2s ease;
      flex-shrink: 0;
      height: 24px;
    }

    .counter-badge.active {
      border-color: var(--figma-brand);
      color: var(--figma-text);
    }

    .counter-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--figma-text-secondary);
      flex-shrink: 0;
    }

    .counter-badge.active .dot {
      background-color: var(--figma-brand);
      box-shadow: 0 0 4px var(--figma-brand);
    }

    .counter-badge .count-number {
      font-weight: 600;
      color: var(--figma-text);
    }

    .main-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    
    .main-actions .icon-btn {
      flex: 1;
      height: 36px;
      border: 1px solid var(--figma-border);
    }

    .main-actions .primary-btn {
      border: 1px solid transparent;
    }

    #status {
      font-size: 11px;
      font-weight: 500;
      color: var(--figma-text-secondary);
      text-align: center;
      margin-top: auto;
      padding-bottom: 2px;
      text-overflow: ellipsis;
      overflow: hidden;
      white-space: nowrap;
    }

    .success { color: var(--figma-success) !important; }
    .error   { color: var(--figma-danger) !important; }
    .warning { color: var(--figma-warning) !important; }

    #resize-handle {
      position: fixed;
      bottom: 0;
      right: 0;
      width: 12px;
      height: 12px;
      cursor: se-resize;
      z-index: 99999;
      display: flex;
      align-items: flex-end;
      justify-content: flex-end;
      padding: 1px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>Vibe Slides</h2>
    <div class="header-actions">
      <button id="fontDecBtn" class="icon-btn" title="Réduire la taille de tous les textes (-1px, ou Shift+Clic -2px)" style="font-size: 10px; font-weight: 600; width: 26px;">
        A-
      </button>
      <button id="fontIncBtn" class="icon-btn" title="Augmenter la taille de tous les textes (+1px, ou Shift+Clic +2px)" style="font-size: 10px; font-weight: 600; width: 26px;">
        A+
      </button>
      <button id="replaceImageBtn" class="icon-btn" title="Remplacer l'image">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
      </button>
      <button id="renameBtn" class="icon-btn" title="Auto-renommer le template">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="counterBadge" class="counter-badge">
    <span class="dot"></span>
    <span id="counterText" style="text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">Aucune sélection</span>
  </div>

  <div class="main-actions">
    <!-- Paste & Generate -->
    <button id="generateBtn" class="icon-btn primary-btn" title="Générer / Corriger depuis le presse-papier">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
        <path d="M5 3v4"/><path d="M19 17v4"/><path d="M3 5h4"/><path d="M17 19h4"/>
      </svg>
    </button>

    <!-- Actions Correctives -->
    <button id="correctBtn" class="icon-btn" title="Appliquer les actions correctives (Texte Bulle Bold, Intro 50 Regular)">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h9"/>
        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
      </svg>
    </button>

    <!-- Split -->
    <button id="splitBtn" class="icon-btn" title="Découper les étapes">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" x2="8.12" y1="4" y2="15.88"/><line x1="14.47" x2="20" y1="14.48" y2="20"/><line x1="8.12" x2="12" y1="8.12" y2="12"/>
      </svg>
    </button>

    <!-- Prototype -->
    <button id="prototypeBtn" class="icon-btn" title="Lier le prototype">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="16" width="6" height="6" rx="1" /><rect x="2" y="16" width="6" height="6" rx="1" /><rect x="9" y="2" width="6" height="6" rx="1" /><path d="M5 16v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3" /><path d="M12 8v3" />
      </svg>
    </button>

    <!-- Clear -->
    <button id="clearBtn" class="icon-btn" title="Supprimer les découpages et le prototype">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3 6 5 6 21 6"/>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>

    <!-- Transform -->
    <button id="transformBtn" class="icon-btn" title="Adapter une leçon existante">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/>
        <path d="m15 5 4 4"/>
      </svg>
    </button>
  </div>

  <!-- Zone de collage masquée pour contourner les restrictions Electron/Figma -->
  <textarea id="hiddenPasteArea" style="position: fixed; left: -9999px; opacity: 0;" tabindex="-1"></textarea>

  <div id="status">Prêt</div>

  <div id="resize-handle">
    <svg width="8" height="8" viewBox="0 0 10 10" fill="none" style="opacity: 0.35;">
      <path d="M10 0 L0 10 M10 4 L4 10 M10 8 L8 10" stroke="var(--figma-text-secondary)" stroke-width="1.2" stroke-linecap="round"/>
    </svg>
  </div>

  <script>
    const generateBtn     = document.getElementById('generateBtn');
    const renameBtn       = document.getElementById('renameBtn');
    const replaceImageBtn = document.getElementById('replaceImageBtn');
    const splitBtn        = document.getElementById('splitBtn');
    const correctBtn      = document.getElementById('correctBtn');
    const prototypeBtn    = document.getElementById('prototypeBtn');
    const clearBtn        = document.getElementById('clearBtn');
    const transformBtn    = document.getElementById('transformBtn');
    const statusDiv       = document.getElementById('status');
    const hiddenPasteArea = document.getElementById('hiddenPasteArea');

    let pasteMode = 'generate';

    function stripTrailingCommas(jsonStr) {
      return jsonStr.replace(/,\s*([\]}])/g, "$1");
    }
    function parseJSONRobustly(str) {
      let cleaned = str.trim();

      // Nettoyage robuste des commentaires sans toucher aux chaînes de caractères
      cleaned = cleaned.replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*")|(\/\*[\s\S]*?\*\/|\/\/[^\n]*)/g, function(match, string) {
        if (string) {
          return string; // Conserve la chaîne de caractères intacte
        }
        return ""; // Supprime le commentaire
      });

      // Nettoyage des blocs de code Markdown (JSON)
      cleaned = cleaned.replace(/^```json\s*/i, "").replace(/```\s*$/, "").trim();
      cleaned = cleaned.replace(/^```\s*/, "").replace(/```\s*$/, "").trim();
      
      // Nettoyage des virgules en début/fin du payload
      cleaned = cleaned.replace(/^,+/, "").replace(/,+$/, "").trim();

      // Essai de parsing standard
      try {
        return JSON.parse(cleaned);
      } catch (e) {
        try {
          // Normalisation des séparations d'objets adjacents
          let normalized = cleaned.replace(/}\s*([,\s]*)\s*{/g, "},{");
          if (normalized.startsWith("{") && normalized.endsWith("}")) {
            normalized = "[" + normalized + "]";
          }
          return JSON.parse(stripTrailingCommas(normalized));
        } catch (e2) {
          try {
            return JSON.parse(stripTrailingCommas(cleaned));
          } catch (e3) {
            throw e; // Lève l'erreur originale de parsing
          }
        }
      }
    }
    // Fonction commune de traitement du JSON
    async function handlePasteData(text) {
      if (!text || !text.trim()) {
        showStatus('Presse-papier vide', 'error');
        return;
      }
      
      let jsonText = text;
      const trimmedText = text.trim();
      
      // Si c'est un chemin de fichier local, on tente de le charger via le serveur local
      if (trimmedText.endsWith('.json') && (trimmedText.startsWith('/') || trimmedText.startsWith('file://') || trimmedText.includes(':\\') || trimmedText.includes(':/'))) {
        showStatus('Chargement du fichier...', '');
        try {
          let relativePath = trimmedText.replace(/^file:\/\/\/?/, "");
          relativePath = decodeURIComponent(relativePath);
          const workspacePath = "/Users/maximeelhaik/Documents/VIBE CODING GENERATION";
          if (relativePath.startsWith(workspacePath)) {
            relativePath = relativePath.substring(workspacePath.length);
          }
          if (!relativePath.startsWith('/')) {
            relativePath = '/' + relativePath;
          }
          const fileUrl = 'http://localhost:8080' + relativePath;
          
          const response = await fetch(fileUrl);
          if (!response.ok) {
            throw new Error(`Erreur HTTP: ${response.status}`);
          }
          jsonText = await response.text();
        } catch (fetchErr) {
          console.error("Échec du chargement local du fichier JSON:", fetchErr);
          showStatus('Fichier inaccessible', 'error');
          return;
        }
      }

      try {
        const parsed = parseJSONRobustly(jsonText);
        showStatus('Traitement en cours...', '');
        if (pasteMode === 'transform' || parsed.type === 'transform-slides' || (parsed.slides && parsed.slides.some(s => s.source_slide_index !== undefined || s.duplicates !== undefined))) {
          parent.postMessage({ pluginMessage: { type: 'transform-slides', data: parsed } }, '*');
        } else if (parsed.corrections && Array.isArray(parsed.corrections)) {
          parent.postMessage({ pluginMessage: { type: 'apply-corrections', data: parsed } }, '*');
        } else {
          parent.postMessage({ pluginMessage: { type: 'generate-slides', data: parsed } }, '*');
        }
        // Réinitialise le mode après traitement
        pasteMode = 'generate';
      } catch (err) {
        // Détection de contenu HTML/CSS sur-mesure si le parsing JSON échoue
        const trimmed = jsonText.trim();
        if (trimmed.startsWith('<') || trimmed.includes('</') || trimmed.includes('<div') || trimmed.includes('<style') || trimmed.includes('<!DOCTYPE')) {
          showStatus('Génération sur-mesure HTML -> Figma...', '');
          try {
            const spec = parseHTMLToFigmaSpec(trimmed);
            parent.postMessage({ pluginMessage: { type: 'build-custom-slide', data: spec } }, '*');
          } catch (htmlErr) {
            console.error("Erreur de parsing HTML:", htmlErr);
            showStatus('Échec de création de la slide HTML', 'error');
          }
        } else {
          console.error(err);
          showStatus('JSON ou HTML invalide', 'error');
        }
      }
    }

    function parseHTMLToFigmaSpec(htmlStr) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlStr, 'text/html');

      // Récupère les balises style et les injecte temporairement dans l'iframe
      const styles = doc.querySelectorAll('style');
      const injectedStyles = [];
      styles.forEach(s => {
        const styleEl = document.createElement('style');
        styleEl.textContent = s.textContent;
        document.head.appendChild(styleEl);
        injectedStyles.push(styleEl);
      });

      const container = document.createElement('div');
      container.style.position = 'fixed';
      container.style.left = '-9999px';
      container.style.top = '0px';
      container.style.width = '1920px';
      container.style.margin = '0';
      container.style.padding = '0';

      const bodyContent = doc.body ? doc.body.innerHTML : htmlStr;
      container.innerHTML = bodyContent;
      document.body.appendChild(container);

      function elementToSpec(el, slideOriginX, slideOriginY) {
        if (el.nodeType === Node.TEXT_NODE) {
          const txt = el.textContent.replace(/\s+/g, ' ').trim();
          if (!txt) return null;
          const range = document.createRange();
          range.selectNodeContents(el);
          const rect = range.getBoundingClientRect();
          const parentEl = el.parentElement;
          const parentRect = parentEl ? parentEl.getBoundingClientRect() : rect;
          const parentName = parentEl ? (parentEl.getAttribute('data-figma-name') || parentEl.id || parentEl.className) : null;
          return {
            type: 'TEXT',
            text: txt,
            figmaName: parentName || 'Texte',
            rect: {
              x: rect.left - parentRect.left,
              y: rect.top - parentRect.top,
              width: Math.max(10, Math.ceil(rect.width)),
              height: Math.max(10, Math.ceil(rect.height)),
              parentWidth: Math.max(10, Math.ceil(parentRect.width))
            }
          };
        }
        if (el.nodeType !== Node.ELEMENT_NODE) return null;

        const tag = el.tagName.toLowerCase();
        if (tag === 'style' || tag === 'script' || tag === 'link' || tag === 'meta') return null;

        const comp = window.getComputedStyle(el);
        if (comp.display === 'none' || comp.visibility === 'hidden') return null;

        const elRect = el.getBoundingClientRect();
        const parentEl = el.parentElement;
        const parentRect = parentEl ? parentEl.getBoundingClientRect() : { left: slideOriginX, top: slideOriginY };

        const children = [];
        for (const c of el.childNodes) {
          const childSpec = elementToSpec(c, slideOriginX, slideOriginY);
          if (childSpec) children.push(childSpec);
        }

        const customName = el.getAttribute('data-figma-name') || el.id || el.className;

        return {
          type: 'FRAME',
          tagName: tag,
          figmaName: customName || tag,
          className: el.className || '',
          rect: {
            x: elRect.left - parentRect.left,
            y: elRect.top - parentRect.top,
            width: Math.max(1, Math.round(elRect.width)),
            height: Math.max(1, Math.round(elRect.height))
          },
          styles: {
            display: comp.display,
            flexDirection: comp.flexDirection,
            justifyContent: comp.justifyContent,
            alignItems: comp.alignItems,
            gap: parseFloat(comp.gap) || parseFloat(comp.columnGap) || parseFloat(comp.rowGap) || 0,
            paddingTop: parseFloat(comp.paddingTop) || 0,
            paddingRight: parseFloat(comp.paddingRight) || 0,
            paddingBottom: parseFloat(comp.paddingBottom) || 0,
            paddingLeft: parseFloat(comp.paddingLeft) || 0,
            backgroundColor: comp.backgroundColor,
            color: comp.color,
            fontSize: parseFloat(comp.fontSize) || 16,
            fontWeight: comp.fontWeight,
            fontStyle: comp.fontStyle,
            borderRadius: parseFloat(comp.borderTopLeftRadius) || parseFloat(comp.borderRadius) || 0,
            width: Math.round(elRect.width),
            height: Math.round(elRect.height),
            flexGrow: parseFloat(comp.flexGrow) || 0,
            flexShrink: parseFloat(comp.flexShrink) || 1,
            alignSelf: comp.alignSelf,
            textAlign: comp.textAlign,
            flexWrap: comp.flexWrap,
            position: comp.position,
            top: parseFloat(comp.top) || 0,
            left: parseFloat(comp.left) || 0,
            opacity: parseFloat(comp.opacity),
            overflow: comp.overflow,
            lineHeight: comp.lineHeight,
            letterSpacing: comp.letterSpacing,
            textTransform: comp.textTransform,
            borderWidth: parseFloat(comp.borderTopWidth) || 0,
            borderColor: comp.borderTopColor,
            borderStyle: comp.borderTopStyle,
            boxShadow: comp.boxShadow,
            maxWidth: parseFloat(comp.maxWidth) || 0,
            minWidth: parseFloat(comp.minWidth) || 0,
            backgroundImage: comp.backgroundImage,
            gridTemplateColumns: comp.gridTemplateColumns,
            clipPath: comp.clipPath
          },
          children: children
        };
      }

      const slideElements = [];
      for (const child of container.children) {
        const tag = child.tagName.toLowerCase();
        if (tag !== 'style' && tag !== 'script' && tag !== 'link' && tag !== 'meta') {
          slideElements.push(child);
        }
      }

      let result;
      if (slideElements.length > 1) {
        result = {
          type: 'MULTI_SLIDES',
          slides: slideElements.map(el => {
            const r = el.getBoundingClientRect();
            return elementToSpec(el, r.left, r.top);
          })
        };
      } else {
        const root = slideElements[0] || container;
        const r = root.getBoundingClientRect();
        result = elementToSpec(root, r.left, r.top);
      }

      document.body.removeChild(container);
      injectedStyles.forEach(s => document.head.removeChild(s));

      return result;
    }

    // Clic sur le bouton d'envoi : on focus la zone cachée et on invite à faire Cmd+V
    generateBtn.onclick = () => {
      pasteMode = 'generate';
      hiddenPasteArea.focus();
      showStatus('👉 Faites Cmd+V pour coller', 'warning');
    };

    // Écouteur global de paste (si le plugin est simplement focus)
    window.addEventListener('paste', (e) => {
      const text = e.clipboardData.getData('text');
      if (text) {
        handlePasteData(text);
      }
    });

    // Écouteur de paste sur la zone cachée
    hiddenPasteArea.addEventListener('paste', (e) => {
      e.stopPropagation(); // Évite le double déclenchement sur window
      const text = e.clipboardData.getData('text');
      if (text) {
        handlePasteData(text);
      }
    });

    const fontDecBtn      = document.getElementById('fontDecBtn');
    const fontIncBtn      = document.getElementById('fontIncBtn');

    fontDecBtn.onclick = (e) => {
      const delta = e.shiftKey ? -2 : -1;
      parent.postMessage({ pluginMessage: { type: 'scale-text-size', delta } }, '*');
    };

    fontIncBtn.onclick = (e) => {
      const delta = e.shiftKey ? 2 : 1;
      parent.postMessage({ pluginMessage: { type: 'scale-text-size', delta } }, '*');
    };

    renameBtn.onclick = () => {
      showStatus('Analyse...', '');
      parent.postMessage({ pluginMessage: { type: 'rename-template' } }, '*');
    };

    replaceImageBtn.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'toggle-replace-mode' } }, '*');
    };

    splitBtn.onclick = () => {
      showStatus('Découpage...', '');
      parent.postMessage({ pluginMessage: { type: 'split-slides' } }, '*');
    };

    correctBtn.onclick = () => {
      showStatus('Application des corrections...', '');
      parent.postMessage({ pluginMessage: { type: 'apply-manual-corrections' } }, '*');
    };

    prototypeBtn.onclick = () => {
      showStatus('Prototypage...', '');
      parent.postMessage({ pluginMessage: { type: 'prototype-slides' } }, '*');
    };

    clearBtn.onclick = () => {
      showStatus('Nettoyage...', '');
      parent.postMessage({ pluginMessage: { type: 'clear-slides' } }, '*');
    };

    transformBtn.onclick = () => {
      pasteMode = 'transform';
      hiddenPasteArea.focus();
      showStatus('👉 Faites Cmd+V pour transformer', 'warning');
    };

    window.onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (msg.type === 'success') {
        showStatus(msg.message, 'success');
      } else if (msg.type === 'error') {
        showStatus(msg.message, 'error');
      } else if (msg.type === 'warning') {
        showStatus(msg.message, 'warning');
      } else if (msg.type === 'replace-mode-state') {
        if (msg.active) {
          replaceImageBtn.classList.add('active');
          showStatus('Sélectionnez la source...', 'warning');
        } else {
          replaceImageBtn.classList.remove('active');
          showStatus('Prêt', '');
        }
      } else if (msg.type === 'selection-update') {
        const badge = document.getElementById('counterBadge');
        const text  = document.getElementById('counterText');
        if (msg.count > 0) {
          badge.classList.add('active');
          if (msg.text && msg.text.startsWith('Icône détectée')) {
            text.innerHTML = `<strong>${msg.name}</strong>`;
          } else {
            text.innerHTML = `<span class="count-number">${msg.count}</span> car. &mdash; "${msg.name}"`;
          }
        } else {
          badge.classList.remove('active');
          text.textContent = 'Aucune sélection';
        }
      } else if (msg.type === 'fetch-assets') {
        const EMBEDDED_ICONS = {
          "mdi:shield-unlocked": '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M12 1L3 5v6c0 5.5 3.8 10.7 9 12c5.2-1.3 9-6.5 9-12V5zm4 14.8c0 .6-.6 1.2-1.3 1.2H9.2c-.6 0-1.2-.6-1.2-1.3v-3.5c0-.6.6-1.2 1.2-1.2V8.5C9.2 7.1 10.6 6 12 6s2.8 1.1 2.8 2.5V9h-1.3v-.5c0-.8-.7-1.3-1.5-1.3s-1.5.5-1.5 1.3V11h4.3c.6 0 1.2.6 1.2 1.3z"/></svg>',
          "mdi:people-group": '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M12 5.5A3.5 3.5 0 0 1 15.5 9a3.5 3.5 0 0 1-3.5 3.5A3.5 3.5 0 0 1 8.5 9A3.5 3.5 0 0 1 12 5.5M5 8c.56 0 1.08.15 1.53.42c-.15 1.43.27 2.85 1.13 3.96C7.16 13.34 6.16 14 5 14a3 3 0 0 1-3-3a3 3 0 0 1 3-3m14 0a3 3 0 0 1 3 3a3 3 0 0 1-3 3c-1.16 0-2.16-.66-2.66-1.62a5.54 5.54 0 0 0 1.13-3.96c.45-.27.97-.42 1.53-.42M5.5 18.25c0-2.07 2.91-3.75 6.5-3.75s6.5 1.68 6.5 3.75V20h-13zM0 20v-1.5c0-1.39 1.89-2.56 4.45-2.9c-.59.68-.95 1.62-.95 2.65V20zm24 0h-3.5v-1.75c0-1.03-.36-1.97-.95-2.65c2.56.34 4.45 1.51 4.45 2.9z"/></svg>',
          "mdi:flowchart": '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M9 2v6h2v3H5c-1.11 0-2 .89-2 2v3H1v6h6v-6H5v-3h6v3H9v6h6v-6h-2v-3h6v3h-2v6h6v-6h-2v-3c0-1.11-.89-2-2-2h-6V8h2V2z"/></svg>',
          "mdi:lifebuoy": '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M19.79 15.41c.95-2.17.95-4.66 0-6.82l-2.74 1.24c.6 1.38.6 2.95.01 4.34zm-4.37-11.2a8.54 8.54 0 0 0-6.83 0l1.24 2.73c1.39-.59 2.96-.59 4.35.01zM4.21 8.58a8.56 8.56 0 0 0 0 6.84l2.74-1.25c-.6-1.38-.6-2.96 0-4.35zm4.38 11.21a8.5 8.5 0 0 0 6.83-.01l-1.24-2.73a5.5 5.5 0 0 1-4.34.01zM12 2a10 10 0 0 1 10 10a10 10 0 0 1-10 10A10 10 0 0 1 2 12A10 10 0 0 1 12 2m0 6a4 4 0 0 0-4 4a4 4 0 0 0 4 4a4 4 0 0 0 4-4a4 4 0 0 0-4-4"/></svg>',
          "mdi:shield-check": '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="m10 17l-4-4l1.41-1.41L10 14.17l6.59-6.59L18 9m-6-8L3 5v6c0 5.55 3.84 10.74 9 12c5.16-1.26 9-6.45 9-12V5z"/></svg>',
          "mdi:credit-card": '<svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24"><path fill="currentColor" d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2m0 7H4V8h16Z"/></svg>',

        };

        async function fetchIcon(task) {
          try {
            if (task.type === 'icon' && EMBEDDED_ICONS[task.name]) {
              return { id: task.id, name: task.name, type: 'icon', data: EMBEDDED_ICONS[task.name] };
            }
            const response = await fetch(task.url);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            if (task.type === 'image') {
              const buffer = await response.arrayBuffer();
              const bytes = Array.from(new Uint8Array(buffer));
              return { id: task.id, name: task.name, type: 'image', data: bytes };
            } else {
              const text = await response.text();
              return { id: task.id, name: task.name, type: 'icon', data: text };
            }
          } catch (e) {
            return { id: task.id, name: task.name, type: task.type || 'icon', error: true, message: e.message };
          }
        }
        Promise.all(msg.tasks.map(fetchIcon)).then(results => {
          parent.postMessage({ pluginMessage: { type: 'assets-loaded', results } }, '*');
        });
      }
    };

    function showStatus(text, className) {
      statusDiv.textContent = text;
      statusDiv.className = className;
    }

    const resizeHandle = document.getElementById('resize-handle');
    let isResizing = false;
    let startWidth, startHeight, startX, startY;

    resizeHandle.addEventListener('pointerdown', (e) => {
      isResizing = true;
      startWidth = window.innerWidth;
      startHeight = window.innerHeight;
      startX = e.screenX;
      startY = e.screenY;
      resizeHandle.setPointerCapture(e.pointerId);
      e.preventDefault();
    });

    resizeHandle.addEventListener('pointermove', (e) => {
      if (!isResizing) return;
      const dx = e.screenX - startX;
      const dy = e.screenY - startY;
      const width = Math.round(Math.max(240, startWidth + dx));
      const height = Math.round(Math.max(170, startHeight + dy));
      parent.postMessage({ pluginMessage: { type: 'resize-window', width, height } }, '*');
    });

    const stopResize = (e) => {
      if (isResizing) {
        isResizing = false;
        try { resizeHandle.releasePointerCapture(e.pointerId); } catch (err) {}
      }
    };

    resizeHandle.addEventListener('pointerup', stopResize);
    resizeHandle.addEventListener('pointercancel', stopResize);
  </script>
